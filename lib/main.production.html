    window._ = require('lodash')

  <script type='text/javascript'>
    // Suppress Electron 14+ renderer-side `vm module deprecated` warning.
    // Source: cson-parser/lib/parse.js:35 (via @rokt33r/season on every
    // .cson note read/write). Documented in CLAUDE.md item #4.
    (function() {
      const filters = [
        'vm module of Node.js',
        '[Violation]',
        'non-passive event listener'
      ]
      const matches = function(args) {
        if (!args.length || typeof args[0] !== 'string') return false
        for (let i = 0; i < filters.length; i++) {
          if (args[0].indexOf(filters[i]) !== -1) return true
        }
        return false
      }
      const origWarn = console.warn
      const origLog = console.log
      console.warn = function() {
        if (matches(arguments)) return
        return origWarn.apply(console, arguments)
      }
      console.log = function() {
        if (matches(arguments)) return
        return origLog.apply(console, arguments)
      }
    })()
    const electron = require('electron')
    const remote = require('@electron/remote')
    // Both `webFrame.setVisualZoomLevelLimits` and
    // `setLayoutZoomLevelLimits` were removed in Electron 25 — neither
    // has a direct replacement. Block user-driven viewport zoom
    // (Ctrl+Wheel + pinch) at the DOM event layer instead. The
    // app-level Cmd+/Cmd-/Cmd-0 path through ZoomManager.js calls
    // webContents.setZoomLevel and is unaffected by this guard.
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.preventDefault()
    }, { passive: false })
    var scriptUrl = window._.find(remote.process.argv, (a) => a === '--hot')
      ? 'http://localhost:8080/assets/main.js'
      : '../compiled/main.js'
    var scriptEl = document.createElement('script')
    scriptEl.setAttribute('type', 'text/javascript')
    scriptEl.setAttribute('src', scriptUrl)
    document.body.appendChild(scriptEl)
  </script>
